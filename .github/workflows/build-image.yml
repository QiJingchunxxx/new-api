name: Build custom image (GHCR)

# 二次开发分支专用：在 GitHub 的机器上构建镜像并推到 GHCR。
# 服务器（1核2G 跑不动编译）只需要 docker compose pull，几十秒完成部署。
#
# 与上游工作流互不影响：
#   - docker-build.yml 只在打 tag 时触发，且推送到 calciumion/new-api
#   - ci.yml 只在 pull_request 时触发
# 本工作流只在 push 到 main 或手动触发时运行。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch:

concurrency:
  group: build-custom-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # GHCR 镜像名必须全小写，而 GitHub 用户名可能含大写，这里统一转成小写
      - name: Compute image reference
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/new-api" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 服务器通常是 x86_64；若要用 ARM 服务器改成 linux/amd64,linux/arm64（QEMU 模拟会慢一倍以上）
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 用 GitHub Actions 缓存复用 Docker 层，只改 Go 代码时能省掉前端构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          {
            echo "### 镜像已推送"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "服务器上执行："
            echo ""
            echo '```bash'
            echo "docker compose pull new-api && docker compose up -d new-api"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
